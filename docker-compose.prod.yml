services:
  db:
    image: postgres:latest
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    volumes:
      - frontend_build:/app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: .env.prod
    expose:
      - 8000
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "8888:80"
    volumes:
      - frontend_build:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - default
      - shared-net

volumes:
  frontend_build:
  postgres_data:

networks:
        default:
        shared-net:
                external: true
