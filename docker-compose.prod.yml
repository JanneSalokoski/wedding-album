services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    command: echo "Frontend built - handled by nginx"
    volumes:
      - frontend_build:/app/dist

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: .env
    expose:
      - 8000

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - frontend_build:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  frontend_build:
